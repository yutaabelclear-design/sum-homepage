<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OK | 静岡大学 学生フォーミュラ SUM</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080808;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    }
    .ok-box {
      text-align: center;
      color: #ffffff;
    }
    .ok-mark {
      font-size: 22vw;
      font-weight: 900;
      line-height: 1;
      color: #ff8a00;
      margin: 0;
    }
    .ok-note {
      margin-top: 16px;
      font-size: 18px;
      color: rgba(255, 255, 255, 0.7);
    }
    .ok-back {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 28px;
      border-radius: 999px;
      background: #ff8a00;
      color: #080808;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="ok-box">
    <p class="ok-mark">OK</p>
    <p class="ok-note">リンクは正しく動作しています(仮リンク先です)</p>
    <a class="ok-back" href="javascript:history.back()">戻る</a>
  </div>
</body>
</html>
